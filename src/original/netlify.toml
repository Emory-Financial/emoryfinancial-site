[[redirects]]
  from = "/areas/index.html"
  to = "/areas"
  status = 301
  force = true

# The thank-you page is a directory index (thanks/index.html), which resolves
# reliably without depending on implicit .html handling. This just catches
# anyone arriving at the old path.
[[redirects]]
  from = "/thanks.html"
  to = "/thanks/"
  status = 301

# ---- Per-originator vanity subdomains ----
# Add each as a domain alias in Netlify first (Domain management -> Add domain alias),
# then these rules point them at the right profile page. This gives each originator a
# memorable URL for business cards while keeping all SEO authority on the main domain.
[[redirects]]
  from = "https://jon.emoryfinancial.com/*"
  to = "https://emoryfinancial.com/team/jon-lam"
  status = 301
  force = true

[[redirects]]
  from = "https://derek.emoryfinancial.com/*"
  to = "https://emoryfinancial.com/team/derek-shao"
  status = 301
  force = true

[[redirects]]
  from = "/team.html"
  to = "/team"
  status = 301
  force = true

# Legacy WordPress paths from emoryfinancial.com -> new equivalents
[[redirects]]
  from = "/about-us"
  to = "/about"
  status = 301

[[redirects]]
  from = "/contact-us"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/mortgage-calculator"
  to = "/calculators"
  status = 301

[[redirects]]
  from = "/the-mortgage-process"
  to = "/#main"
  status = 301

[[redirects]]
  from = "/home-mortgage"
  to = "/loans#purchase"
  status = 301

[[redirects]]
  from = "/refinance-mortgage"
  to = "/loans#refinance"
  status = 301

[[redirects]]
  from = "/cash-out-refinance"
  to = "/loans#cashout"
  status = 301

[[redirects]]
