# Emory Financial — Netlify configuration
# Static site: no build step required.

[build]
  publish = "."
  command = ""
  # Only deploy when the built website changes. Commits that touch only src/, docs or
  # instructions are skipped, so they don't use a production deploy (15 Netlify credits each).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ netlify.toml"

# Clean URLs: /loans instead of /loans.html
[[redirects]]
  from = "/loans.html"
  to = "/loans"
  status = 301
  force = true

[[redirects]]
  from = "/calculators.html"
  to = "/calculators"
  status = 301
  force = true

[[redirects]]
  from = "/faq.html"
  to = "/faq"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/partners.html"
  to = "/partners"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/areas/san-gabriel-valley.html"
  to = "/areas/san-gabriel-valley"
  status = 301
  force = true

[[redirects]]
  from = "/areas/arcadia.html"
  to = "/areas/arcadia"
  status = 301
  force = true

[[redirects]]
  from = "/areas/pasadena.html"
  to = "/areas/pasadena"
